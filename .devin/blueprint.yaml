initialize: |
  # Node 22 (apt's nodejs is v12, too old for Vite/Prisma 7)
  curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | sudo tar -xJf - -C /usr/local --strip-components=1
  # Postgres 16 in Docker for local dev (docker start is idempotent)
  docker run -d --name republica-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=republicahub -p 5432:5432 postgres:16-alpine || docker start republica-pg
  cp -n .env.example .env
maintenance: |
  npm install
  (cd web && npm install)
